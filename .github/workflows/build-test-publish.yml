name: Build, test and publish

on:
  workflow_call:
    inputs:
      runner:
        description: Label du runner (vide = ubuntu-latest)
        required: false
        type: string
        default: ""
      openwrt_version:
        description: OpenWrt version passed as OPENWRT_VERSION build argument (e.g. "master" or "25.12.6")
        required: true
        type: string
      ci_tag:
        description: Docker Hub tag used for the intermediate CI image (e.g. "ci-openwrt-stable")
        required: true
        type: string
      publish_tags:
        description: Space-separated Docker Hub tags that are set after the tests passed
        required: true
        type: string
      publish_versioned_tag:
        description: Additionally publish the tag "openwrt-<openwrt_version>-<git hash>"
        required: false
        type: boolean
        default: false

env:
  OPENWRT_VERSION: ${{ inputs.openwrt_version }}
  DOCKER_REPO: bprtkop/openwrt-balena
  CI_IMAGE: bprtkop/openwrt-balena:${{ inputs.ci_tag }}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host # Important to access local Docker registry

      - name: Login into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'bprtkop' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          provenance: false
          platforms: |
            linux/x86_64
            linux/arm64
          build-args: |
            OPENWRT_VERSION=${{ env.OPENWRT_VERSION }}
            BUILDKIT_MULTI_PLATFORM=1
          tags: |
            ${{ env.CI_IMAGE }}
            localhost:5000/local/openwrt-balena:latest

      - name: Inspect
        run: |
          docker buildx imagetools inspect localhost:5000/local/openwrt-balena:latest

      - name: Build and export
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          tags: openwrt-balena:latest
          build-args: OPENWRT_VERSION=${{ env.OPENWRT_VERSION }}
          allow: security.insecure,network.host
          outputs: type=docker,dest=/tmp/openwrt-balena-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt Docker Image
          path: /tmp/openwrt-balena-image.tar

  sbom:
    name: SBOM generation
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate alpine SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.CI_IMAGE }}
          upload-artifact: false
          format: cyclonedx-json
          output-file: alpine_sbom.json

      - name: Prepare OpenWrt rootfs
        run: |
          sed -i "s|^\(\s*\)image: .*|\1image: $CI_IMAGE|" docker-compose.yml
          grep -n "image:" docker-compose.yml

          set +e
          timeout --preserve-status 60 docker compose up
          set -e

          sudo find /var/lib/docker/volumes/
          IMAGE=$(sudo cat /var/lib/docker/volumes/openwrt-balena_data/_data/current_version)
          echo $IMAGE

          sudo ./src/mount_openwrt_squashfs_combined.sh "/var/lib/docker/volumes/openwrt-balena_data/_data/${IMAGE}"

      - name: Generate OpenWrt SBOM
        uses: anchore/sbom-action@v0
        with:
          path: /mnt
          upload-artifact: false
          format: cyclonedx-json
          output-file: openwrt_sbom.json

      - name: Generate web-frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: web-frontend
          upload-artifact: false
          format: cyclonedx-json
          output-file: web-frontend_sbom.json

      - name: Generate web-backend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: web-backend
          upload-artifact: false
          format: cyclonedx-json
          output-file: web-backend_sbom.json

      - name: Archive artifacts (SBOMs)
        uses: actions/upload-artifact@v7
        with:
          name: Software Bill of Material (SBOM)
          path: ./*.json
          if-no-files-found: error

  test:
    name: Test
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: OpenWrt Docker Image
          path: .

      - name: Install VMs
        run: |
          set -x
          sudo snap install multipass

          sleep 180
          sudo chmod a+w /var/snap/multipass/common/multipass_socket

          multipass find

          sudo ip link add lannetvm type bridge
          sudo ip link add wannetvm type bridge
          sudo ip link set dev lannetvm up
          sudo ip link set dev wannetvm up
          ip addr

          sudo ufw disable

          printf '#cloud-config\nruncmd:\n  - curl -fsSL https://get.docker.com | sh\n  - adduser ubuntu docker\n' | \
            multipass launch 24.04 --cpus 2 --memory 4G --disk 40G --timeout 1800 --cloud-init - \
            --network name=wannetvm,mac=06:00:00:11:22:33 --network name=lannetvm,mac=06:00:00:44:55:66 --name router-vm
          multipass mount $GITHUB_WORKSPACE router-vm

          multipass launch --network wannetvm --name wan-vm
          multipass launch --network lannetvm --name lan-vm

      - name: Show VM and and environments variables
        run:  |
          export
          multipass exec router-vm -- lsb_release -a
          multipass info

      - name: Load image
        run: |
          multipass exec router-vm -- docker load --input openwrt-balena-image.tar
          multipass exec router-vm -- docker image ls -a

      - name: Prepare VMs
        run: |
          multipass exec router-vm -- sudo apt-get -y install python3-pip python-is-python3 python3-venv
          multipass exec router-vm -- find .
          multipass exec router-vm -- bash -c 'python -m venv ~/.venv'
          multipass exec router-vm -- bash -c 'source ~/.venv/bin/activate && pip install -r test/requirements.txt'

          echo '******** router-vm IPs ********'
          multipass exec router-vm -- ip addr

          echo '******** wan-vm IPs ********'
          multipass exec wan-vm -- sudo ip addr add 192.168.22.1/24 dev eth1
          multipass exec wan-vm -- ip addr
          multipass exec wan-vm -- sudo sh -c 'apt-get update && apt-get install -y isc-dhcp-server && echo "default-lease-time 600;\nmax-lease-time 7200;\nsubnet 192.168.22.0 netmask 255.255.255.0 {\n  range 192.168.22.100 192.168.22.200;\n  option routers 192.168.22.1;\n  option domain-name-servers 8.8.8.8, 8.8.4.4;\n  option domain-name \"example.org\";\n}" > /etc/dhcp/dhcpd.conf && systemctl enable isc-dhcp-server && systemctl restart isc-dhcp-server'
          multipass exec wan-vm -- cat /etc/dhcp/dhcpd.conf
          multipass exec wan-vm -- sudo modprobe iptable_nat
          multipass exec wan-vm -- sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          multipass exec wan-vm -- sudo sysctl -w net.ipv4.ip_forward=1

          echo '******** lan-vm IPs ********'
          multipass exec lan-vm -- sudo ip addr add 172.31.1.2/24 dev eth1
          multipass exec lan-vm -- sudo ip addr add 172.31.22.2/24 dev eth1
          multipass exec lan-vm -- ip addr

          echo '******** host IPs ********'
          ip addr
          sudo ufw status

          echo '******** router-vm IPs ********'
          multipass exec router-vm -- sudo ip addr add 192.168.22.99/24 dev eth1
          multipass exec router-vm -- sudo ip addr add 172.31.22.99/24 dev eth2
          multipass exec router-vm -- ip addr

          echo '******** Test connection between router-vm, lan-vm and wan-vm ********'
          multipass exec router-vm -- ping -c 1 192.168.22.1
          multipass exec router-vm -- ping -c 1 172.31.22.2

      - name: Run tests
        run: |
          cat test/tests/docker-compose.yml.template
          multipass exec router-vm -- bash -c 'source ~/.venv/bin/activate && cd test/ && pytest -v -s --html=report.html --self-contained-html --reruns 3'

      - name: Archive test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test report
          path: test/*.html
          if-no-files-found: error

  publish:
    name: Publish
    needs: test
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'bprtkop' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image at Docker Hub
        env:
          PUBLISH_TAGS: ${{ inputs.publish_tags }}
          PUBLISH_VERSIONED_TAG: ${{ inputs.publish_versioned_tag }}
        run: |
          TAGS=()
          for TAG in $PUBLISH_TAGS; do
            TAGS+=(--tag "${DOCKER_REPO}:$TAG")
          done

          if [ "$PUBLISH_VERSIONED_TAG" = "true" ]; then
            GIT_HASH=`git rev-parse --short HEAD`
            TAGS+=(--tag "${DOCKER_REPO}:openwrt-$OPENWRT_VERSION-$GIT_HASH")
          fi

          echo "Publishing $CI_IMAGE as: ${TAGS[*]}"
          docker buildx imagetools create "${TAGS[@]}" "$CI_IMAGE"

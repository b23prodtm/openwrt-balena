name: openwrt-balena
type: sw.application
description: >-
  OpenWrt full system emulation in a container with KVM and macvtap, adapted
  for ARM/ARM64 targets and balenaCloud deployment.
assets:
  url:
    repo: https://github.com/b23prodtm/openwrt-balena
    dir: /
data:
  applicationConfig:
    SUPERVISOR_VPN_CONTROL: "false"
  defaultDeviceType: raspberrypi5
  supportedDeviceTypes:
    - raspberrypi5
    - raspberrypi4-64
    - raspberrypi3-64
    - generic-aarch64
    - intel-nuc
  configuration:
    config:
      - BALENA_HOST_CONFIG_dtoverlay: "pcie-3gen"
  environment:
    - LAN_IF: "veth,nofixedip"
    - WAN_IF: "host"
